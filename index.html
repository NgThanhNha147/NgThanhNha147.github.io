<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Nguyen Thi Thanh Nha - Full-stack Developer portfolio"
    />
    <meta name="theme-color" content="#020817" />
    <title>Thanh Nha - Full-stack Developer</title>
    <style>
      html,
      body,
      #app {
        min-height: 100%;
        margin: 0;
        background: #020817;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      setTimeout(() => {
        const app = document.getElementById("app");
        const retryKey = "portfolio-asset-retry";
        if (
          app &&
          !app.firstElementChild &&
          !sessionStorage.getItem(retryKey)
        ) {
          sessionStorage.setItem(retryKey, "1");
          location.replace(`${location.pathname}?refresh=${Date.now()}`);
        }
      }, 4000);
    </script>
  </body>
</html>
